menu_title: '&8Gacha de Armas'
open_command: astralmenu_gacha_rpg
size: 27
update_interval: 1
items:
  'info':
    material: AMETHYST_SHARD
    slot: 4
    amount: 1
    display_name: '&#B07CFF&l✦ Gacha de Armas ✦'
    lore:
    - '&7Armas, materiales y talismanes'
    - ''
    - '&7Precio: &e1.000$ &7por tirada'
    - '&7Epico garantizado cada &f50 &7tiradas'
    - '&7Tu garantia: &e%objective_score_{pity_rpg}%&7/50'
    enchantments:
    - 'unbreaking;1'
    item_flags:
    - HIDE_ATTRIBUTES
    - HIDE_ENCHANTS
    update: true
  'x1':
    material: AMETHYST_SHARD
    slot: 10
    amount: 1
    display_name: '&#B07CFF&lTirar x1'
    lore:
    - ''
    - '&7Precio: &e1.000$'
    - '&7Suma 1 tirada a tu garantia'
    - ''
    - ''
    - '&eClic para tirar'
    item_flags:
    - HIDE_ATTRIBUTES
    click_requirement:
      requirements:
        plata:
          type: has money
          amount: 1000
      deny_commands:
      - '[message] &cNo te alcanza: cuesta &e1.000$&c. &7(/balance)'
      - '[sound] ENTITY_VILLAGER_NO'
    click_commands:
    - '[close]'
    - '[takemoney] 1000'
    - '[sound] BLOCK_AMETHYST_BLOCK_CHIME'
    - '[console] scoreboard players add %player_name% pity_rpg 1'
    - '[console] scoreboard players set %player_name% gachaflag 0'
    - '[console] execute if score %player_name% pity_rpg matches 50.. run scoreboard players set %player_name% gachaflag 1'
    - '[console] execute if score %player_name% gachaflag matches 1 run minecraft:tellraw %player_name% {text:''Tirada garantizada! (Epico o Legendario seguro)'',color:''light_purple'',bold:true}'
    - '[console] execute if score %player_name% gachaflag matches 1 run crates forceopen gacha_rpg_garantia %player_name%'
    - '[console] execute unless score %player_name% gachaflag matches 1 run crates forceopen gacha_rpg %player_name%'
