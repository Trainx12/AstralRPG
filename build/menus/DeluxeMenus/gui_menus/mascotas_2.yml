    - '&8Los bonus solo se activan en mazmorras.'
    - ''
    - '&eClic izquierdo: equipar e invocar'
    - '&bClic derecho: ver detalle'
    item_flags:
    - HIDE_ATTRIBUTES
    item_model: 'astral:mascotas/ghastito_0'
    priority: 1
    update: true
    view_requirement:
      requirements:
        tiene:
          type: has permission
          permission: astral.mascota.ghastito
        nivel:
          type: '>='
          input: '%objective_score_{plv_ghastito}%'
          output: '20'
    left_click_requirement:
