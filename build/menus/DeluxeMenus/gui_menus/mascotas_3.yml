    - ''
    - '&eClic izquierdo: equipar e invocar'
    - '&bClic derecho: ver detalle'
    item_flags:
    - HIDE_ATTRIBUTES
    item_model: 'astral:mascotas/saqueador_0'
    priority: 1
    update: true
    view_requirement:
      requirements:
        tiene:
          type: has permission
          permission: astral.mascota.saqueador
        nivel:
          type: '>='
          input: '%objective_score_{plv_saqueador}%'
