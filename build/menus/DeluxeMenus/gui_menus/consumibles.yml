size: 27
items:
  'frasco_xp_pequeno':
    material: PAPER
    slot: 11
    amount: 1
    display_name: '&aFrasco de Experiencia Pequeno'
    lore:
    - '&e300,000$'
    - '&7Necesitas un espacio libre.'
    item_flags:
    - HIDE_ATTRIBUTES
    item_model: 'astral:frasco_xp_pequeno'
    click_requirement:
      requirements:
        espacio:
          type: javascript
          expression: 'BukkitPlayer.getInventory().firstEmpty() >= 0'
        plata:
          type: has money
          amount: 300000
      deny_commands:
      - '[message] &cNo te alcanza: cuesta &e300.000$&c. &7(/balance)'
      - '[sound] ENTITY_VILLAGER_NO'
    click_commands:
    - '[takemoney] 300000'
    - '[console] loot give %player_name% loot astral:item/frasco_xp_pequeno'
    - '[close]'
