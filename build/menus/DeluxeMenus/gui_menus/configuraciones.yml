menu_title: '&8Configuraciones'
open_command: configuraciones
size: 45
register_command: true
update_interval: 1
items:
  'titulo':
    material: COMPARATOR
    slot: 4
    amount: 1
    display_name: '&7&lConfiguraciones'
    lore:
    - '&7Elegi cuantos efectos ves.'
    - '&7Los interruptores solo cambian lo que ves vos.'
    - '&7Solo apagan efectos nuevos.'
    - '&7Las particulas de siempre siguen visibles.'
    - '&7El dano y las habilidades son iguales.'
    - '&7Avisos de jefes y particulas MythicMobs siguen.'
    item_flags:
    - HIDE_ATTRIBUTES
    item_model: 'astral:menu/icon_titulos'
  'efectos_bajo_activo':
    material: GRAY_DYE
    slot: 11
    amount: 1
    display_name: '&f&lEfectos: Bajo &a[ACTIVO]'
    lore:
    - '&7El juego como siempre.'
    - '&7Sin efectos nuevos y solo 3 particulas'
    - '&7por golpe. Ideal para PCs flojas.'
    - ''
    - '&a▶ Elegido'
    enchantments:
    - 'unbreaking;1'
    item_flags:
    - HIDE_ATTRIBUTES
    - HIDE_ENCHANTS
    priority: 1
    update: true
    view_requirement:
      requirements:
        activo:
          type: '=='
          input: '%objective_score_{astral.fx}%'
          output: '0'
    click_commands:
    - '[sound] UI_BUTTON_CLICK'
    - '[player] efectos bajo'
    - '[refresh]'
    item_model: 'astral:boton_efectos_bajo_activo'
