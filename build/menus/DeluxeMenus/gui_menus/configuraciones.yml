    update: true
    view_requirement:
      requirements:
        activo:
          type: ==
          input: '%objective_score_{astral.fx}%'
          output: '1'
  efectos_alto_activo:
    material: MAGENTA_DYE
    slot: 15
    amount: 1
    display_name: '&d&lEfectos: Alto &6[ACTIVO]'
    lore: *id007
    item_flags: *id008
    click_commands: *id009
    item_model: astral:boton_efectos_alto_activo
    priority: 1
    update: true
    view_requirement:
      requirements:
        activo:
          type: ==
          input: '%objective_score_{astral.fx}%'
          output: '2'
