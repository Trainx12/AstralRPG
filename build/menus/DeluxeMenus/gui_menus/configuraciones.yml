menu_title: '&f'
open_command: configuraciones
size: 27
register_command: true
items:
  titulo:
    material: COMPARATOR
    slot: 4
    amount: 1
    display_name: '&7&lConfiguraciones'
    lore:
    - '&7Elegi cuantos efectos ves.'
    - '&7Solo cambia lo que ves vos:'
    - '&7el dano y las habilidades son iguales.'
    item_flags:
    - HIDE_ATTRIBUTES
    item_model: astral:boton_info
  efectos_bajo:
    material: GRAY_DYE
    slot: 11
    amount: 1
    display_name: '&f&lEfectos: Bajo'
    lore: &id001
    - '&7El juego como siempre.'
    - '&7Sin efectos nuevos y solo 3 particulas'
    - '&7por golpe. Ideal para PCs flojas.'
    - ''
    - '&eClic para elegirlo.'
    item_flags: &id002
    - HIDE_ATTRIBUTES
    click_commands: &id003
    - '[sound] UI_BUTTON_CLICK'
    - '[player] efectos bajo'
    - '[close]'
    item_model: astral:boton_efectos_bajo
    priority: 2
  efectos_medio:
    material: LIME_DYE
    slot: 13
    amount: 1
    display_name: '&a&lEfectos: Medio'
    lore: &id004
    - '&7Lo de siempre, mas:'
    - '&7- disparos de bastones de color'
    - '&7- anillos en los golpes de los jefes'
    - '&8(con el que arrancan todos)'
    - ''
    - '&eClic para elegirlo.'
    item_flags: &id005
    - HIDE_ATTRIBUTES
    click_commands: &id006
    - '[sound] UI_BUTTON_CLICK'
    - '[player] efectos medio'
    - '[close]'
    item_model: astral:boton_efectos_medio
    priority: 2
  efectos_alto:
    material: MAGENTA_DYE
    slot: 15
    amount: 1
    display_name: '&d&lEfectos: Alto'
    lore: &id007
    - '&7Todo lo de Medio, mas:'
    - '&7- explosiones de los jefes'
    - '&7- rastros de armas al caminar'
    - '&7- auras de armaduras con el set'
    - '&7- rastro de mascotas evolucionadas'
    - ''
    - '&eClic para elegirlo.'
    item_flags: &id008
    - HIDE_ATTRIBUTES
    click_commands: &id009
    - '[sound] UI_BUTTON_CLICK'
    - '[player] efectos alto'
    - '[close]'
    item_model: astral:boton_efectos_alto
    priority: 2
  volver:
    material: ARROW
    slot: 26
    amount: 1
    display_name: '&fVolver al menu'
    item_flags:
    - HIDE_ATTRIBUTES
    click_commands:
    - '[openguimenu] principal'
    item_model: astral:boton_volver
  efectos_bajo_activo:
    material: GRAY_DYE
    slot: 11
    amount: 1
    display_name: '&f&lEfectos: Bajo &6[ACTIVO]'
    lore: *id001
    item_flags: *id002
    click_commands: *id003
    item_model: astral:boton_efectos_bajo_activo
    priority: 1
    update: true
    view_requirement:
      requirements:
        activo:
          type: ==
          input: '%objective_score_{astral.fx}%'
          output: '0'
  efectos_medio_activo:
    material: LIME_DYE
    slot: 13
    amount: 1
    display_name: '&a&lEfectos: Medio &6[ACTIVO]'
    lore: *id004
    item_flags: *id005
    click_commands: *id006
    item_model: astral:boton_efectos_medio_activo
