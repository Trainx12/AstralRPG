menu_title: '&8Gacha de Monturas'
open_command: astralmenu_gacha_monturas
size: 27
update_interval: 1
items:
  'info':
    material: SADDLE
    slot: 4
    amount: 1
    display_name: '&#7ED957&l✦ Gacha de Monturas ✦'
    lore:
    - '&7Monturas con silla y mascotas'
    - ''
    - '&7Precio: &e2.500$ &7por tirada'
    - '&7Epico garantizado cada &f40 &7tiradas'
    - '&7Tu garantia: &e%objective_score_{pity_monturas}%&7/40'
    enchantments:
    - 'unbreaking;1'
    item_flags:
    - HIDE_ATTRIBUTES
    - HIDE_ENCHANTS
    update: true
  'x1':
    material: WHEAT
    slot: 10
    amount: 1
    display_name: '&#7ED957&lTirar x1'
    lore:
    - ''
    - '&7Precio: &e2.500$'
    - '&7Suma 1 tirada a tu garantia'
    - ''
    - ''
    - '&eClic para tirar'
    item_flags:
    - HIDE_ATTRIBUTES
    click_requirement:
      requirements:
        plata:
          type: has money
          amount: 2500
      deny_commands:
      - '[message] &cNo te alcanza: cuesta &e2.500$&c. &7(/balance)'
      - '[sound] ENTITY_VILLAGER_NO'
    click_commands:
    - '[close]'
    - '[takemoney] 2500'
    - '[sound] BLOCK_AMETHYST_BLOCK_CHIME'
    - '[console] scoreboard players add %player_name% pity_monturas 1'
    - '[console] scoreboard players set %player_name% gachaflag 0'
    - '[console] execute if score %player_name% pity_monturas matches 40.. run scoreboard players set %player_name% gachaflag 1'
    - '[console] execute if score %player_name% gachaflag matches 1 run minecraft:tellraw %player_name% {text:''Tirada garantizada! (Epico o Legendario seguro)'',color:''light_purple'',bold:true}'
    - '[console] execute if score %player_name% gachaflag matches 1 run crates forceopen gacha_monturas_garantia %player_name%'
    - '[console] execute unless score %player_name% gachaflag matches 1 run crates forceopen gacha_monturas %player_name%'
