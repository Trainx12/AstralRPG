    item_model: 'astral:mascotas/nav_info'
    item_flags:
    - HIDE_ATTRIBUTES
    - HIDE_ENCHANTS
    - HIDE_DYE
    click_commands:
    - '[sound] UI_BUTTON_CLICK'
    - '[openguimenu] guia_astral'
  'cerrar':
