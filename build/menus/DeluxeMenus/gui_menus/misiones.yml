  'ayuda':
    material: CLOCK
    slot: 8
    amount: 1
    display_name: '&b&lComo aceptar'
    lore:
    - '&f1. Lee el objetivo y el premio en la tarjeta.'
    - '&f2. Clic en la tarjeta o en &aACEPTAR MISION&f.'
    - '&f3. Vas a ver &bACTIVA &fy una confirmacion.'
    - '&f4. Completa el objetivo y usa &eCOMPROBAR&f.'
    - '&7Las diarias cambian a las 00:00 (Argentina).'
    item_flags:
    - HIDE_ATTRIBUTES
    item_model: 'astral:cronista/active'
  'historia_0_available_hit_9':
    material: PAPER
