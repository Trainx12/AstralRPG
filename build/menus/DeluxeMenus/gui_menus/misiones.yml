    material: BOOK
    slot: 0
    amount: 1
    display_name: '&b&lHistoria'
    lore:
    - '&7Abre la tarjeta de esa mision.'
    - '&7Cambiar de pestana no acepta nada.'
    item_flags:
    - HIDE_ATTRIBUTES
    item_model: 'astral:cronista/history'
    click_commands:
    - '[console] execute as %player_name% at @s run function astral:quest/gui/page/0'
    - '[console] dm open misiones %player_name%<delay=2>'
