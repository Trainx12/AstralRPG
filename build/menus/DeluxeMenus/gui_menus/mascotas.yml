size: 27
items:
  'info':
    material: BONE
    slot: 4
    amount: 1
    display_name: '&6&l✦ Mascotas ✦'
    lore:
    - '&7Una a la vez. Te siguen y te dan efectos.'
    - '&7Suben de nivel con los mobs que matas:'
    - '&7nivel 10 y 20 = efecto extra, nivel 30 = evolucion.'
    - ''
    - '&8En el lobby no pueden salir.'
    item_flags:
    - HIDE_ATTRIBUTES
  'm_lobo':
    material: WOLF_SPAWN_EGG
    slot: 10
    amount: 1
    display_name: '&#9AA0A8&lLobo del Bosque'
    lore:
    - ''
    - '&7Nivel: &e%objective_score_{plv_lobo}%&7/30'
    - ''
    - '&fNivel 1: &7Fuerza I'
    - '&fNivel 10: &7+ Velocidad I'
    - '&fNivel 20: &7+ Resistencia I'
    - ''
    - '&eClic para invocar'
    item_flags:
    - HIDE_ATTRIBUTES
    priority: 1
    view_requirement:
      requirements:
        tiene:
          type: has permission
          permission: astral.mascota.lobo
    click_commands:
    - '[close]'
    - '[console] scoreboard players set %player_name% mascota 1'
  'm_lobo_no':
