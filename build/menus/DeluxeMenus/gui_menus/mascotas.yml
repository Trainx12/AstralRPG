menu_title: '&f'
open_command: mascotas
size: 54
register_command: true
update_interval: 1
items:
  'info':
    material: PAPER
    slot: 4
    amount: 1
    display_name: '&6&lSantuario de companeros'
    lore:
    - '&7Puedes llevar una mascota a la vez.'
    - '&7Te sigue y sube de nivel con tus bajas.'
    - '&7Nivel 10 y 20: mejores bonus; nivel 30: evolucion.'
    - ''
    - '&7Pasa el cursor por cada retrato para ver sus bonus.'
    - '&8Bonus solo dentro de las mazmorras.'
    item_flags:
    - HIDE_ATTRIBUTES
    item_model: 'astral:mascotas/nav_info'
  'm_lobo_nv20':
    material: PAPER
    slot: 9
    amount: 1
    display_name: '&#9AA0A8&lLobo del Bosque'
    lore:
    - ''
    - '&7Nivel: &e%objective_score_{plv_lobo}%&7/30'
    - ''
    - '&a&lAl equiparla ahora:'
    - '&f+ Fuerza I'
    - '&f+ Velocidad I'
    - '&f+ Resistencia I'
    - ''
    - '&6&lMejoras que te da'
    - '&aDesde nivel 1: &fFuerza I'
    - '&eDesde nivel 10: &f+ Velocidad I'
    - '&eDesde nivel 20: &f+ Resistencia I'
    - '&7Nivel 30: evolucion visual'
    - ''
    - '&8Los bonus solo se activan en mazmorras.'
    - ''
    - '&eClic izquierdo: equipar e invocar'
    - '&bClic derecho: ver detalle'
    item_flags:
    - HIDE_ATTRIBUTES
    item_model: 'astral:mascotas/lobo_0'
    priority: 1
    update: true
    view_requirement:
      requirements:
        tiene:
          type: has permission
          permission: astral.mascota.lobo
        nivel:
          type: '>='
          input: '%objective_score_{plv_lobo}%'
          output: '20'
    left_click_requirement:
      requirements:
        tiene:
          type: has permission
          permission: astral.mascota.lobo
      deny_commands:
      - '[message] &cTodavia no tienes esta mascota.'
      - '[sound] ENTITY_VILLAGER_NO'
    left_click_commands:
    - '[close]'
    - '[console] scoreboard players set %player_name% mascota 1'
    right_click_commands:
    - '[openguimenu] mascota_lobo'
