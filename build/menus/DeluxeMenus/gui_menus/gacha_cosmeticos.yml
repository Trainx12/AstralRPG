menu_title: '&8Gacha de Cosmeticos'
open_command: astralmenu_gacha_cosmeticos
size: 27
update_interval: 1
items:
  'info':
    material: NAME_TAG
    slot: 4
    amount: 1
    display_name: '&#FF7BD5&l✦ Gacha de Cosmeticos ✦'
    lore:
    - '&7Titulos para el chat y adornos'
    - ''
    - '&7Precio: &e500$ &7por tirada'
    - '&7Epico garantizado cada &f20 &7tiradas'
    - '&7Tu garantia: &e%objective_score_{pity_cosmeticos}%&7/20'
    enchantments:
    - 'unbreaking;1'
    item_flags:
    - HIDE_ATTRIBUTES
    - HIDE_ENCHANTS
    update: true
  'x1':
    material: PINK_DYE
    slot: 10
    amount: 1
    display_name: '&#FF7BD5&lTirar x1'
    lore:
    - ''
    - '&7Precio: &e500$'
    - '&7Suma 1 tirada a tu garantia'
    - ''
    - ''
    - '&eClic para tirar'
    item_flags:
    - HIDE_ATTRIBUTES
    click_requirement:
      requirements:
        plata:
          type: has money
          amount: 500
      deny_commands:
      - '[message] &cNo te alcanza: cuesta &e500$&c. &7(/balance)'
      - '[sound] ENTITY_VILLAGER_NO'
    click_commands:
    - '[close]'
    - '[takemoney] 500'
    - '[sound] BLOCK_AMETHYST_BLOCK_CHIME'
    - '[console] scoreboard players add %player_name% pity_cosmeticos 1'
    - '[console] scoreboard players set %player_name% gachaflag 0'
    - '[console] execute if score %player_name% pity_cosmeticos matches 20.. run scoreboard players set %player_name% gachaflag 1'
    - '[console] execute if score %player_name% gachaflag matches 1 run minecraft:tellraw %player_name% {text:''Tirada garantizada! (Epico o Legendario seguro)'',color:''light_purple'',bold:true}'
    - '[console] execute if score %player_name% gachaflag matches 1 run crates forceopen gacha_cosmeticos_garantia %player_name%'
    - '[console] execute unless score %player_name% gachaflag matches 1 run crates forceopen gacha_cosmeticos %player_name%'
