menu_title: '&8Menu de AstralRPG'
open_command: menu
size: 27
update_interval: 1
items:
  'info':
    material: NETHER_STAR
    slot: 4
    amount: 1
    display_name: '&b&l✦ AstralRPG ✦'
    lore:
    - '&7Todo lo del servidor, sin comandos.'
    enchantments:
    - 'unbreaking;1'
    item_flags:
    - HIDE_ATTRIBUTES
    - HIDE_ENCHANTS
  'mascotas':
    material: BONE
    slot: 10
    amount: 1
    display_name: '&6&lMascotas'
    lore:
    - '&7Invoca o guarda tu mascota'
    item_flags:
    - HIDE_ATTRIBUTES
    click_commands:
    - '[openguimenu] mascotas'
  'bazar':
    material: EMERALD
    slot: 12
    amount: 1
    display_name: '&a&lBazar'
    lore:
    - '&7Mercado, subastas y ordenes'
    item_flags:
    - HIDE_ATTRIBUTES
    click_commands:
    - '[openguimenu] bazar'
  'guia':
    material: WRITABLE_BOOK
    slot: 14
    amount: 1
    display_name: '&d&lGuia de AstralRPG'
    lore:
    - '&7Clases, items, recetas y la Forja'
    item_flags:
    - HIDE_ATTRIBUTES
    click_commands:
    - '[close]'
    - '[player] trigger astral.guia set 1'
  'plata':
    material: GOLD_NUGGET
    slot: 16
    amount: 1
    display_name: '&e&lTu plata'
    lore:
    - '&7Tenes: &e%vault_eco_balance_formatted%$'
    item_flags:
    - HIDE_ATTRIBUTES
    update: true
  'spawn':
    material: COMPASS
    slot: 22
    amount: 1
    display_name: '&f&lVolver al lobby'
    lore:
    - '&7Te lleva a la plaza'
    item_flags:
    - HIDE_ATTRIBUTES
    click_commands:
    - '[close]'
    - '[player] spawn'
  'misiones':
    material: BOOK
    slot: 20
    amount: 1
    display_name: '&b&lMisiones e historia'
    lore:
    - '&7Consulta tu capitulo y las diarias'
    - '&7El Cronista entrega los premios'
    item_flags:
    - HIDE_ATTRIBUTES
    click_commands:
    - '[console] execute as %player_name% at @s run function astral:quest/gui/page/0'
    - '[openguimenu] misiones'
