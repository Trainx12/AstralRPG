nameFormat: astral_lobby_survival
speedLimit: 0.16
gravity: 0.0
slowDown: false
keepChunksLoaded: true
allowPlayerEnter: true
allowPlayerExit: true
allowMobEnter: false
invincible: true
playerTakeable: false
collision:
  players: CANCEL
  misc: CANCEL
  train: CANCEL
  block: DEFAULT
carts:
- entityType: MINECART
  astral-model: head
