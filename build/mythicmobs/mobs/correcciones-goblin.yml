astral_golem_bosque:
  Type: ZOMBIE
  Display: '&aGolem de bosque'
  Health: 20
  Damage: 3
  Options:
    Silent: true
    Glowing: true
    MovementSpeed: 0.25
    PreventSunburn: true
    PreventOtherDrops: true
    PreventRandomEquipment: true
    PreventItemPickup: true
    Despawn: false
    FollowRange: 64
  AIGoalSelectors:
  - clear
  - meleeattack
  - randomstroll
  AITargetSelectors:
  - clear
  - players
  Skills:
  - model{m=astral_golem_bosque} @self ~onSpawn
  - model{m=astral_golem_bosque} @self ~onLoad
  - state{s=attack} @self ~onAttack
  - skill{s=AST_MUERTE} @self ~onDeath
  - glowbone{g=true;c=FFFFFF} @self ~onTimer:20
  - sound{s=entity.iron_golem.hurt;v=0.6} @self ~onDamaged
  - sound{s=entity.iron_golem.death;v=0.6} @self ~onDeath
  - command{c="execute as <caster.uuid> at @s run function astral:golems/xp"} @self ~onDeath
