astral_vac_golem:
  Type: ZOMBIE
  Display: '&5Golem de Meteorito'
  Health: 40
  Damage: 8
  Options:
    Silent: true
    PreventOtherDrops: true
    PreventSunburn: true
    PreventRandomEquipment: true
    PreventItemPickup: true
    MovementSpeed: 0.25
    Despawn: true
    FollowRange: 40
  AIGoalSelectors:
  - clear
  - meleeattack
  - randomstroll
  - lookatplayers
  AITargetSelectors:
  - clear
  - attacker
  - players
  Skills:
  - model{m=astral_golem_cristal;s=1.7} @self ~onSpawn
  - model{m=astral_golem_cristal;s=1.7} @self ~onLoad
  - tint{c=7A4CFF} @self ~onSpawn
