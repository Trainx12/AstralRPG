# Generado por mobs/mazmorra.py + mobs/tanda2.py
astral_cumbre_control_sala1:
  Type: ARMOR_STAND
  Display: Control Plaza de la fuente
  Health: 100
  Options:
    Invisible: true
    Marker: true
    Invincible: true
    Silent: true
    NoGravity: true
    Despawn: false
    Persistent: true
    Collidable: false
  Skills:
  - command{c="execute as <caster.uuid> at @s run function astral:tanda2/cumbre/sala1/tick"} @self ~onTimer:20
  - foreach{s=AST_ESQ_CONVIERTE_cumbre_sala1;sync=true} @EntitiesInRadius{r=66} ~onTimer:5 ?hastag{tag=cumbre.on}
  - skill{s=CUMBRE_SALA1_INICIO} @self ~onTimer:20 ?playerwithin{d=34} ?!hastag{tag=cumbre.on}
  - skill{s=CUMBRE_SALA1_OLA2} @self ~onTimer:20 ?hastag{tag=cumbre.ola1} ?!hastag{tag=cumbre.ola2} ?!hastag{tag=cumbre.espera} ?!hastag{tag=cumbre.sala1.busy}
  - skill{s=CUMBRE_SALA1_OLA3} @self ~onTimer:20 ?hastag{tag=cumbre.ola2} ?!hastag{tag=cumbre.ola3} ?!hastag{tag=cumbre.espera} ?!hastag{tag=cumbre.sala1.busy}
  - skill{s=CUMBRE_SALA1_OLA4} @self ~onTimer:20 ?hastag{tag=cumbre.ola3} ?!hastag{tag=cumbre.ola4} ?!hastag{tag=cumbre.espera} ?!hastag{tag=cumbre.sala1.busy}
  - skill{s=CUMBRE_SALA1_LIMPIA} @self ~onTimer:20 ?hastag{tag=cumbre.ola4} ?!hastag{tag=cumbre.fin} ?!hastag{tag=cumbre.espera} ?!hastag{tag=cumbre.sala1.busy}
  - skill{s=CUMBRE_SALA1_RESET} @self ~onTimer:200 ?hastag{tag=cumbre.on} ?!playerwithin{d=42}
