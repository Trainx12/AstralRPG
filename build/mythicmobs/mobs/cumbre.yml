  - command{c="execute at <caster.uuid> run tag @e[type=armor_stand,distance=..160,name='Control Trono del Yeti'] add cumbre.jefe.derrotado"} @self ~onDeath
  - addtag{tag=ad.cumbre.sala2} @self ~onSpawn
