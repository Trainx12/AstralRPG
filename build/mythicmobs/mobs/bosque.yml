astral_bosque_chaman:
  Type: EVOKER
  Display: '&2&lChaman del Pantano'
  Health: 12500
  Damage: 8
  Options:
    Glowing: true
    PreventOtherDrops: true
    Silent: false
    PreventSunburn: true
    Despawn: false
    MovementSpeed: 0.25
    KnockbackResistance: 0.8
    FollowRange: 40
    PreventRandomEquipment: true
  AIGoalSelectors:
  - clear
  - meleeattack
  - randomstroll
  - lookatplayers
  AITargetSelectors:
  - clear
  - attacker
  - players
  BossBar:
    Enabled: true
    Title: '&2&lChaman del Pantano'
    Range: 48
    Color: GREEN
    Style: SEGMENTED_10
  Drops:
  - totem_of_undying 1 0.3
  - emerald 3-8 1
  - slime_ball 2-6 1
  - exp 160
  Skills:
  - skill{s=AST_MODEL_astral_chaman} @self ~onSpawn
  - skill{s=AST_MODEL_astral_chaman} @self ~onLoad
  - state{s=attack} @self ~onAttack
  - command{c="execute at <caster.uuid> run loot spawn ~ ~0.5 ~ loot astral:item/alma_corrupta"} @self ~onDeath 1.0
  - command{c="execute at <caster.uuid> run loot spawn ~ ~0.5 ~ loot astral:item/alma_corrupta"} @self ~onDeath 1.0
  - command{c="execute at <caster.uuid> run loot spawn ~ ~0.5 ~ loot astral:item/chispa_astral"} @self ~onDeath 0.4
  - command{c="execute at <caster.uuid> run loot spawn ~ ~0.5 ~ loot astral:item/gema_umbria"} @self ~onDeath 0.8
  - command{c="execute at <caster.uuid> run loot spawn ~ ~0.5 ~ loot astral:item/esencia_elite"} @self ~onDeath 1.0
  - command{c="execute at <caster.uuid> run loot spawn ~ ~0.5 ~ loot astral:item/esencia_elite"} @self ~onDeath 1.0
  - command{c="execute at <caster.uuid> run loot spawn ~ ~0.5 ~ loot astral:item/esencia_elite"} @self ~onDeath 1.0
  - potion{type=POISON;duration=80;level=1} @PlayersInRadius{r=8} ~onTimer:220
  - command{c="execute as <caster.uuid> at @s run function astral:tanda2/bosque/sala2/helpers"} @self ~onTimer:400
  - message{m="&2Un canto extrano sale del pantano..."} @PlayersInRadius{r=40} ~onSpawn
  - skill{s=AST_MUERTE} @self ~onDeath
  - skill{s=TANDA2_bosque_AST_FASE_astral_chaman_2} @self ~onDamaged ?healthpercent{p=<0.6} ?!hastag{tag=astral.fase2}
  - skill{s=TANDA2_bosque_AST_FASE_astral_chaman_2_veneno} @self ~onTimer:120 ?hastag{tag=astral.fase2} ?playerwithin{d=24}
  - skill{s=TANDA2_bosque_AST_FASE_astral_chaman_3} @self ~onDamaged ?healthpercent{p=<0.25} ?!hastag{tag=astral.fase3}
  - command{c="eco give <trigger.name> 750"} @trigger ~onDeath ?~isplayer
  - glowbone{g=true;c=FFFFFF} @self ~onTimer:20
  - command{c="execute at <caster.uuid> run tag @e[type=armor_stand,distance=..160,name='Control Altar del Chaman'] add bosque.jefe.derrotado"} @self ~onDeath
  - addtag{tag=ad.bosque.sala2} @self ~onSpawn
  - addtag{tag=ad.bosque.sala2} @self ~onLoad
