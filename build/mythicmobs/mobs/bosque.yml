# Generado por mobs/mazmorra.py + mobs/tanda2.py
astral_bosque_control_sala1:
  Type: ARMOR_STAND
  Display: Control Claro de las raices
  Health: 100
  Options:
    Invisible: true
    Marker: true
    Invincible: true
    Silent: true
    NoGravity: true
    Despawn: false
    Persistent: true
    Collidable: false
  Skills:
  - command{c="execute as <caster.uuid> at @s run function astral:tanda2/bosque/sala1/tick"} @self ~onTimer:20
  - foreach{s=AST_ESQ_CONVIERTE_bosque_sala1;sync=true} @EntitiesInRadius{r=72} ~onTimer:5 ?hastag{tag=bosque.on}
  - skill{s=BOSQUE_SALA1_INICIO} @self ~onTimer:20 ?playerwithin{d=40} ?!hastag{tag=bosque.on}
  - skill{s=BOSQUE_SALA1_OLA2} @self ~onTimer:20 ?hastag{tag=bosque.ola1} ?!hastag{tag=bosque.ola2} ?!hastag{tag=bosque.espera} ?!hastag{tag=bosque.sala1.busy}
  - skill{s=BOSQUE_SALA1_OLA3} @self ~onTimer:20 ?hastag{tag=bosque.ola2} ?!hastag{tag=bosque.ola3} ?!hastag{tag=bosque.espera} ?!hastag{tag=bosque.sala1.busy}
  - skill{s=BOSQUE_SALA1_LIMPIA} @self ~onTimer:20 ?hastag{tag=bosque.ola3} ?!hastag{tag=bosque.fin} ?!hastag{tag=bosque.espera} ?!hastag{tag=bosque.sala1.busy}
  - skill{s=BOSQUE_SALA1_RESET} @self ~onTimer:200 ?hastag{tag=bosque.on} ?!playerwithin{d=48}
