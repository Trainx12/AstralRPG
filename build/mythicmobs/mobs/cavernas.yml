# Generado por datapack-src/cavernas.py (plan E5 / 7e). Mobs de las Cavernas de Cristal Astrales.
# Los aparece AstralCavernas (no hay apariciones naturales en el mundo). Vida base x tier: mob/roll.

astral_cav_golem_amatista:
  Type: ZOMBIE
  Display: '&5Golem de Amatista'
  Health: 34
  Damage: 6
  Options:
    Silent: true
    PreventOtherDrops: true
    PreventSunburn: true
    PreventRandomEquipment: true
    PreventItemPickup: true
    MovementSpeed: 0.24
    Despawn: true
    FollowRange: 40
  AIGoalSelectors:
  - clear
  - meleeattack
  - randomstroll
  - lookatplayers
  AITargetSelectors:
  - clear
  - attacker
  - players
  Skills:
  - model{m=astral_golem_cristal;s=1.6} @self ~onSpawn
  - model{m=astral_golem_cristal;s=1.6} @self ~onLoad
  - state{s=attack} @self ~onAttack
  - skill{s=AST_MUERTE} @self ~onDeath
  - sound{s=block.amethyst_block.hit;v=0.8} @self ~onDamaged
  - sound{s=block.amethyst_cluster.break;v=1;p=0.7} @self ~onDeath
  - addtag{tag=cav.mob} @self ~onSpawn
  - addtag{tag=cav.golem} @self ~onSpawn
  - command{c="execute as <caster.uuid> at @s run function astral:mob/roll"} @self ~onSpawn
  - skill{s=AST_PLATA_HOSTIL} @self ~onDeath ?~isplayer
  - command{c="execute at <caster.uuid> run loot spawn ~ ~0.5 ~ loot astral:item/cristal_caverna"} @self ~onDeath 0.35
  - command{c="execute at <caster.uuid> run loot spawn ~ ~0.5 ~ loot astral:item/polvo_cristal"} @self ~onDeath 0.02

