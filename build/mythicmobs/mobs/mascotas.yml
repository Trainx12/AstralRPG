# Mascotas (generado por datapack-src/mobs/mascotas.py)

astral_pet_lobo:
  Type: PIG
  Display: '&fLobo del Bosque'
  Health: 40
  Options:
    Invincible: true
    Silent: true
    Collidable: false
    Despawn: false
    Persistent: false
    PreventOtherDrops: true
    PreventItemPickup: true
    MovementSpeed: 0.32
    FollowRange: 48
  AIGoalSelectors:
  - clear
  - float
  - goToOwner{followrange=4;minrange=2;speed=1.5;teleporttoworld=true}
  - lookatplayers
  AITargetSelectors:
  - clear
  Skills:
  - 'skill{s=PET_MODELO_lobo} @self ~onSpawn'
  - 'skill{s=PET_MODELO_lobo} @self ~onLoad'
  - 'setowner @NearestPlayer{r=4} ~onSpawn'
  - 'remove @self ~onTimer:40 ?!hasowner'
  - 'remove @self ~onTimer:20 ?!ownerIsOnline'
  - 'skill{s=PET_lobo_CHEQUEO} @owner ~onTimer:20'
  - 'skill{s=PET_lobo_BONUS1} @owner ~onTimer:40'
  - 'skill{s=PET_lobo_BONUS2} @owner ~onTimer:40'
  - 'skill{s=PET_lobo_BONUS3} @owner ~onTimer:40'
  - 'skill{s=PET_lobo_EVOLUCION} @owner ~onTimer:100'
  - 'teleport @owner ~onTimer:40 ?!playerwithin{d=20}'

