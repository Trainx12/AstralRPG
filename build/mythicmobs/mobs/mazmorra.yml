# Generado por mobs/mazmorra.py + mobs/tanda2.py
astral_mina_guardian:
  Type: IRON_GOLEM
  Display: '&2&lColoso Musgoso de las Profundidades'
  Health: 72000
  Damage: 16
  Options:
    MovementSpeed: 0.24
    PreventOtherDrops: true
    PreventSunburn: true
    PreventRandomEquipment: true
    Despawn: false
    FollowRange: 32
    Glowing: true
    KnockbackResistance: 0.8
  BossBar:
    Enabled: true
    Title: '&2&lColoso Musgoso de las Profundidades'
    Range: 48
    Color: PURPLE
    Style: SEGMENTED_10
  AIGoalSelectors:
  - clear
  - meleeattack
  - randomstroll
  - lookatplayers
  AITargetSelectors:
  - clear
  - attacker
  - players
  Drops:
  - exp 15
  Skills:
  - skill{s=MINA_MODELO_astral_mina_guardian} @self ~onSpawn
  - skill{s=MINA_MODELO_astral_mina_guardian} @self ~onLoad
  - state{s=attack} @self ~onAttack
  - potion{type=RESISTANCE;duration=240;level=0;hasParticles=false} @self ~onTimer:200
  - throw{velocity=8;velocityY=3} @target ~onAttack 0.35
  - skill{s=MINA_ONDA_GUARDIAN} @self ~onTimer:160
  - skill{s=MINA_GUARDIAN_F2} @self ~onDamaged ?healthpercent{p=<0.6} ?!hastag{tag=mina.f2}
  - skill{s=MINA_GUARDIAN_F3} @self ~onDamaged ?healthpercent{p=<0.25} ?!hastag{tag=mina.f3}
  - command{c="execute as <caster.uuid> at @s run function astral:tanda2/mina/sala4/helpers"} @self ~onTimer:400 ?hastag{tag=mina.f2}
  - command{c="execute at <caster.uuid> run loot spawn ~ ~0.5 ~ loot astral:item/chispa_astral"} @self ~onDeath 1.0
  - command{c="execute at <caster.uuid> run loot spawn ~ ~0.5 ~ loot astral:item/chispa_astral"} @self ~onDeath 1.0
  - command{c="execute at <caster.uuid> run loot spawn ~ ~0.5 ~ loot astral:item/alma_corrupta"} @self ~onDeath 1.0
  - command{c="execute at <caster.uuid> run loot spawn ~ ~0.5 ~ loot astral:item/alma_corrupta"} @self ~onDeath 1.0
  - command{c="execute at <caster.uuid> run loot spawn ~ ~0.5 ~ loot astral:item/nucleo_furia"} @self ~onDeath 0.5
  - command{c="eco give <trigger.name> 1500"} @trigger ~onDeath ?~isplayer
  - command{c="execute at <caster.uuid> run tag @e[type=armor_stand,distance=..160,name='Control Salon del Guardian'] add mina.jefe.derrotado"} @self ~onDeath
  - addtag{tag=ad.mina.sala4} @self ~onSpawn
  - addtag{tag=ad.mina.sala4} @self ~onLoad
astral_mina_control_sala1:
