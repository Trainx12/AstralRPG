  Display: Control Campamento Minero
  Health: 100
  Options:
    Invisible: true
    Marker: true
    Invincible: true
    Silent: true
    NoGravity: true
    Despawn: false
    Persistent: true
    Collidable: false
  Skills:
  - command{c="execute as <caster.uuid> at @s run function astral:tanda2/mina/sala1/tick"} @self ~onTimer:20
  - foreach{s=AST_ESQ_CONVIERTE_mina_sala1;sync=true} @EntitiesInRadius{r=48} ~onTimer:5 ?hastag{tag=mina.on}
  - skill{s=MINA_SALA1_INICIO} @self ~onTimer:20 ?playerwithin{d=16} ?!hastag{tag=mina.on}
  - skill{s=MINA_SALA1_OLA2} @self ~onTimer:20 ?hastag{tag=mina.ola1} ?!hastag{tag=mina.ola2} ?!hastag{tag=mina.espera} ?!hastag{tag=mina.sala1.busy}
  - skill{s=MINA_SALA1_LIMPIA} @self ~onTimer:20 ?hastag{tag=mina.ola2} ?!hastag{tag=mina.fin} ?!hastag{tag=mina.espera} ?!hastag{tag=mina.sala1.busy}
  - skill{s=MINA_SALA1_RESET} @self ~onTimer:200 ?hastag{tag=mina.on} ?!playerwithin{d=24}
