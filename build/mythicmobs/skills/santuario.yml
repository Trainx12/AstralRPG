  - delay 300
  - 'command{c="spawn <target.name>"} @PlayersInRadius{r=38}'
  - delay 20
  - removetag{tag=santuario.on} @self
  - removetag{tag=santuario.fin} @self
  - removetag{tag=santuario.ola1} @self
  - removetag{tag=santuario.ola2} @self
  - removetag{tag=santuario.ola3} @self
  - removetag{tag=santuario.ola4} @self
  - removetag{tag=santuario.ola5} @self

