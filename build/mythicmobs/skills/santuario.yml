  - 'sound{s=ui.toast.challenge_complete} @PlayersInRadius{r=38}'
  - 'command{c="execute as <target.name> at @s run function astral:quest/event/santuario"} @PlayersInRadius{r=38}'
  - delay 40
  - 'skill{s=SANTUARIO_PREMIO} @PlayersInRadius{r=38}'
