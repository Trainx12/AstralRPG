# Mazmorra Santuario Celestial (generada por mazmorra.py)

SANTUARIO_SALA1_INICIO:
  Skills:
  - addtag{tag=santuario.on} @self
  - addtag{tag=santuario.ola1} @self
  - 'message{m="&8[&7Santuario Celestial&8] &fPrueba de los cinco ecos &7- sala 1/1. &cAhi vienen!"} @PlayersInRadius{r=38}'
