  - 'message{m="&6&lLa prueba termino! &7Abran el cofre..."} @PlayersInRadius{r=158}'
  - 'sound{s=ui.toast.challenge_complete} @PlayersInRadius{r=158}'
  - 'command{c="execute as <target.name> at @s run function astral:quest/event/santuario"} @PlayersInRadius{r=158}'
  - 'command{c="lp user <target.name> permission set astral.completada.santuario true"} @PlayersInRadius{r=158}'
  - 'remove @MobsInRadius{r=158;types=astral_santuario_cofre,astral_santuario_guia}'
  - 'summon{type=astral_santuario_cofre;amount=1;radius=0;onSurface=false} @Location{x=257.5;y=64;z=256.5}'
  - 'summon{type=astral_santuario_guia;amount=1;radius=0;onSurface=false} @Location{x=255.5;y=64;z=256.5}'
  - delay 20
  - 'message{m="&eAparecio el cofre del jefe: &fclic para ver el botin&e. &7El guia de Expediciones los lleva a donde quieran."} @PlayersInRadius{r=158}'

