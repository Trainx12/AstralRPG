# Gachas del lobby (generado por datapack-src/lobby.py)

AST_GACHA_RPG:
  Cooldown: 2
  Skills:
  - 'currencytake{a=1000} @trigger'
  - 'sound{s=block.amethyst_block.chime;p=1.2} @trigger'
  - 'command{c="scoreboard players add <trigger.name> pity_rpg 1"} @self'
  - 'command{c="execute if score <trigger.name> pity_rpg matches 50.. run crates forceopen gacha_rpg_garantia <trigger.name>"} @self'
  - 'command{c="execute unless score <trigger.name> pity_rpg matches 50.. run crates forceopen gacha_rpg <trigger.name>"} @self'
  - 'message{m="&d&lTirada garantizada! &7(Epico o Legendario seguro)"} @trigger ?~score{o=pity_rpg;v=>49}'
  - delay 1
  - 'message{m="&7Garantia: &e<trigger.score.pity_rpg>&7/50 &8(a las 50 tiradas sin Epico te toca uno seguro)"} @trigger'

AST_GACHA_RPG_INFO:
  Skills:
  - 'command{c="sudo <trigger.name> crates preview gacha_rpg"} @self'
  - 'message{m="&7Tu garantia en esta gacha: &e<trigger.score.pity_rpg>&7/50"} @trigger'

