# Gachas del lobby (generado por datapack-src/lobby.py)

AST_GACHA_RPG_MENU:
  Skills:
  - 'command{c="scoreboard players set <trigger.name> gachatirar 0"} @self'
  - 'command{c="scoreboard players enable <trigger.name> gachatirar"} @self'
  - 'command{c="tellraw <trigger.name> ['''',{text:''✦ Gacha de Armas ✦ '',color:''#B07CFF'',bold:true},{text:''Elegi cuantas tiradas (clic en el boton):'',color:''gray''}]"} @self'
  - 'command{c="tellraw <trigger.name> ['''',{text:''[x1 - 1.000$]'',color:''#B07CFF'',bold:true,click_event:{action:''run_command'',command:''/trigger gachatirar set 101''},hover_event:{action:''show_text'',value:''Tirar 1 vez por 1.000$''}},'' '',{text:''[x10 - 10.000$]'',color:''#B07CFF'',bold:true,click_event:{action:''run_command'',command:''/trigger gachatirar set 110''},hover_event:{action:''show_text'',value:''Tirar 10 veces por 10.000$''}},'' '',{text:''[x25 - 25.000$]'',color:''#B07CFF'',bold:true,click_event:{action:''run_command'',command:''/trigger gachatirar set 125''},hover_event:{action:''show_text'',value:''Tirar 25 veces por 25.000$''}},'' '',{text:''[x50 - 50.000$]'',color:''#B07CFF'',bold:true,click_event:{action:''run_command'',command:''/trigger gachatirar set 150''},hover_event:{action:''show_text'',value:''Tirar 50 veces por 50.000$''}}]"} @self'
  - 'message{m="&7Tu garantia: &e<trigger.score.pity_rpg>&7/50 &8(Epico seguro a las 50 sin Epico) &7- shift+clic: premios"} @trigger'

AST_GACHA_RPG_INFO:
  Skills:
  - 'command{c="sudo <trigger.name> crates preview gacha_rpg"} @self'
  - 'message{m="&7Tu garantia en esta gacha: &e<trigger.score.pity_rpg>&7/50"} @trigger'

AST_T_GACHA_RPG_1:
  TargetConditions:
  - score{o=gachatirar;v=101} true
  - hascurrency{a=1000} true
  Skills:
  - 'command{c="scoreboard players set <target.name> gachatirar 0"}'
  - 'currencytake{a=1000}'
  - 'state{s=open} @self'
  - 'sound{s=block.amethyst_block.chime;p=1.2}'
  - 'command{c="scoreboard players add <target.name> pity_rpg 1"}'
  - 'command{c="scoreboard players set <target.name> gachaflag 0"}'
  - 'command{c="execute if score <target.name> pity_rpg matches 50.. run scoreboard players set <target.name> gachaflag 1"}'
  - 'command{c="execute if score <target.name> gachaflag matches 1 run tellraw <target.name> {text:''Tirada garantizada! (Epico o Legendario seguro)'',color:''light_purple'',bold:true}"}'
  - 'command{c="execute if score <target.name> gachaflag matches 1 run crates forceopen gacha_rpg_garantia <target.name>"}'
  - 'command{c="execute unless score <target.name> gachaflag matches 1 run crates forceopen gacha_rpg <target.name>"}'
  - 'delay 1'
  - 'message{m="&7Garantia: &e<target.score.pity_rpg>&7/50 &8(a las 50 tiradas sin Epico te toca uno seguro)"}'

