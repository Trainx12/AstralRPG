# Mazmorra Corazon de la Forja (generada por mazmorra.py)

FORJA_SALA1_INICIO:
  Skills:
  - addtag{tag=forja.on} @self
  - addtag{tag=forja.ola1} @self
  - 'message{m="&8[&7Corazon de la Forja&8] &fNucleo de la Forja &7- sala 1/1. &cAhi vienen!"} @PlayersInRadius{r=36}'
  - 'sound{s=entity.warden.emerge;v=0.6;p=1.4} @PlayersInRadius{r=36}'
  - 'summon{type=astral_forja_golem_forja;amount=1;radius=4} @self'

FORJA_SALA1_LIMPIA:
  Skills:
  - addtag{tag=forja.fin} @self
  - 'message{m="&6&lLa prueba termino! &7Abran el cofre..."} @PlayersInRadius{r=36}'
  - 'sound{s=ui.toast.challenge_complete} @PlayersInRadius{r=36}'
  - 'command{c="execute as <target.name> at @s run function astral:quest/event/golem_forja"} @PlayersInRadius{r=36}'
  - delay 40
  - 'skill{s=FORJA_PREMIO} @PlayersInRadius{r=36}'
  - 'skill{s=FORJA_PREMIO_YA} @PlayersInRadius{r=36}'
  - 'message{m="&7En 15 segundos vuelven al lobby."} @PlayersInRadius{r=36}'
  - delay 300
  - 'command{c="spawn <target.name>"} @PlayersInRadius{r=36}'
  - delay 20
  - removetag{tag=forja.on} @self
  - removetag{tag=forja.fin} @self
  - removetag{tag=forja.ola1} @self

FORJA_SALA1_RESET:
  Skills:
  - 'remove @MobsInRadius{r=36;types=astral_forja_golem_forja}'
  - removetag{tag=forja.on} @self
  - removetag{tag=forja.fin} @self
  - removetag{tag=forja.espera} @self
  - removetag{tag=forja.ola1} @self

FORJA_PREMIO:
  TargetConditions:
  - haspermission{p=astral.forja.cd} false
  Skills:
  - 'command{c="loot give <target.name> loot astral:item/esencia_elite"}'
  - 'command{c="loot give <target.name> loot astral:item/esencia_elite"}'
  - 'command{c="loot give <target.name> loot astral:item/esencia_elite"}'
  - 'command{c="loot give <target.name> loot astral:item/esencia_elite"}'
  - 'command{c="loot give <target.name> loot astral:item/alma_corrupta"}'
  - 'command{c="loot give <target.name> loot astral:item/chispa_astral"} 0.25'
  - 'command{c="eco give <target.name> 3000"}'
  - 'command{c="lp user <target.name> permission settemp astral.forja.cd true 30m"}'
  - 'message{m="&6Cofre de Corazon de la Forja: &fmateriales de elite y &e3000$&f. &7(el proximo cofre en 30 minutos)"}'

FORJA_PREMIO_YA:
  TargetConditions:
  - haspermission{p=astral.forja.cd} true
  Skills:
  - 'message{m="&7Ya cobraste el cofre de esta mazmorra hace poco. &8(se puede cobrar cada 30 minutos)"}'

FORJA_ENTRAR:
  Skills:
  - 'message{m="&8[&7Corazon de la Forja&8] &7Bajando a las &fCorazon de la Forja&7... &8(1 salas. Para salir: /spawn)"}'
  - 'command{c="execute in minecraft:forja_volcano run minecraft:tp <trigger.name> 82.5 52 -55.5"}'

