# Mascotas (generado por datapack-src/mobs/mascotas.py)

PET_MODELO_lobo:
  Skills:
  - addtag{tag=astral.seen} @self
  - model{m=astral_pet_lobo} @self

PET_lobo_CHEQUEO:
  TargetConditions:
  - score{o=petsel;v=1} false
  Skills:
  - 'particles{p=poof;amount=12;hS=0.4;vS=0.4} @self'
  - 'remove @self'

PET_lobo_BONUS1:
  Skills:
  - 'potion{type=strength;duration=70;level=0;hasParticles=false}'

PET_lobo_BONUS2:
  TargetConditions:
  - score{o=plv_lobo;v=10to30} true
  Skills:
  - 'potion{type=speed;duration=70;level=0;hasParticles=false}'

PET_lobo_BONUS3:
  TargetConditions:
  - score{o=plv_lobo;v=20to30} true
  Skills:
  - 'potion{type=resistance;duration=70;level=0;hasParticles=false}'

PET_lobo_EVOLUCION:
  TargetConditions:
  - score{o=plv_lobo;v=30to30} true
  Skills:
  - 'model{m=astral_pet_lobo;s=1.35} @self'
  - 'particles{p=end_rod;amount=6;hS=0.4;vS=0.6;speed=0.01} @self'

MASC_INVOCAR_lobo:
  TargetConditions:
  - score{o=mascota;v=1} true
  - haspermission{p=astral.mascota.lobo} true
  - world{w=lobby} false
  Skills:
  - 'command{c="scoreboard players set <target.name> mascota 0"}'
  - 'command{c="scoreboard players set <target.name> petsel 1"}'
  - 'delay 25'
  - 'summon{type=astral_pet_lobo;amount=1}'
  - 'particles{p=happy_villager;amount=20;hS=0.6;vS=0.6}'
  - 'message{m="&7Invocaste a tu &fLobo del Bosque&7. &8(/mascotas para guardarla)"}'

MASC_NOTIENE_lobo:
  TargetConditions:
  - score{o=mascota;v=1} true
  - haspermission{p=astral.mascota.lobo} false
  Skills:
  - 'command{c="scoreboard players set <target.name> mascota 0"}'
  - 'message{m="&cTodavia no tenes al Lobo del Bosque. &7Se consigue en: Espantapajaros y Abejorros (raro)."}'

PET_GANAR_LOBO:
  TargetConditions:
  - isplayer true
  - haspermission{p=astral.mascota.lobo} false
  Skills:
  - 'command{c="lp user <target.name> permission set astral.mascota.lobo true"}'
  - 'sound{s=ui.toast.challenge_complete}'
  - 'command{c="tellraw @a ['''',{text:''(!) '',color:''gold'',bold:true},{text:''<target.name>'',color:''yellow''},{text:'' consiguio la mascota '',color:''gray''},{text:''Lobo del Bosque'',color:''#9AA0A8'',bold:true}]"}'
  - 'message{m="&7Escribi &f/mascotas &7para invocarla."}'

