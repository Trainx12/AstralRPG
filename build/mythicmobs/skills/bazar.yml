AST_BAZAR_ALQ_1:
  TargetConditions:
  - score{o=bazar;v=1} true
  - haspermission{p=astral.puesto.1} false
  - haspermission{p=astral.bazar.inquilino} false
  - hascurrency{a=5000} true
  Skills:
  - 'command{c="scoreboard players set <target.name> bazar 0"}'
  - 'currencytake{a=5000}'
  - 'command{c="qs removeall <caster.var.puesto1>"}'
  - 'command{c="execute in minecraft:lobby run setblock 171 101 149 minecraft:air"}'
  - 'command{c="execute in minecraft:lobby run setblock 171 101 149 minecraft:chest[facing=south]"}'
  - 'command{c="execute in minecraft:lobby run setblock 173 101 149 minecraft:air"}'
  - 'command{c="execute in minecraft:lobby run setblock 173 101 149 minecraft:chest[facing=south]"}'
  - 'setvariable{var=caster.puesto1;value="<target.name>";type=STRING;save=true}'
  - 'command{c="lp user <target.name> parent addtemp puesto1 7d"}'
  - 'command{c="lp group default permission settemp astral.puesto.1 true 7d"}'
  - 'command{c="lp user <target.name> permission settemp astral.bazar.inquilino true 7d"}'
  - 'sound{s=entity.villager.yes}'
  - 'message{m="&6Bazar: &falquilaste el &ePuesto 1&f por 7 dias. &7Arma tu tienda en sus cofres."}'

