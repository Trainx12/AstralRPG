# Bazar del lobby (generado por datapack-src/lobby.py)

AST_BAZAR_MENU:
  Skills:
  - 'command{c="scoreboard players set <trigger.name> bazar 0"} @self'
  - 'command{c="scoreboard players enable <trigger.name> bazar"} @self'
  - 'command{c="tellraw <trigger.name> ['''',{text:''✦ Bazar ✦ '',color:''#E8A33A'',bold:true},{text:''Alquila un puesto y arma tu tienda (clic en el boton):'',color:''gray''}]"} @self'
  - 'command{c="tellraw <trigger.name> ['''',{text:'' Puesto 1: '',color:''white''},{text:''libre '',color:''green''},{text:''[Alquilar 5.000$ / 7 dias]'',color:''#E8A33A'',bold:true,click_event:{action:''run_command'',command:''/trigger bazar set 1''},hover_event:{action:''show_text'',value:''Alquilar el puesto 1 por 5.000$''}}]"} @self ?~!haspermission{p=astral.puesto.1}'
  - 'command{c="tellraw <trigger.name> ['''',{text:'' Puesto 1: '',color:''white''},{text:''es tuyo '',color:''aqua''},{text:''[Renovar 5.000$ / 7 dias mas]'',color:''#E8A33A'',bold:true,click_event:{action:''run_command'',command:''/trigger bazar set 11''},hover_event:{action:''show_text'',value:''Sumar 7 dias mas al puesto 1''}}]"} @self ?~haspermission{p=group.puesto1}'
  - 'command{c="tellraw <trigger.name> ['''',{text:'' Puesto 1: '',color:''white''},{text:''ocupado'',color:''red''}]"} @self ?~haspermission{p=astral.puesto.1} ?~!haspermission{p=group.puesto1}'
  - 'command{c="tellraw <trigger.name> ['''',{text:'' Puesto 2: '',color:''white''},{text:''libre '',color:''green''},{text:''[Alquilar 5.000$ / 7 dias]'',color:''#E8A33A'',bold:true,click_event:{action:''run_command'',command:''/trigger bazar set 2''},hover_event:{action:''show_text'',value:''Alquilar el puesto 2 por 5.000$''}}]"} @self ?~!haspermission{p=astral.puesto.2}'
  - 'command{c="tellraw <trigger.name> ['''',{text:'' Puesto 2: '',color:''white''},{text:''es tuyo '',color:''aqua''},{text:''[Renovar 5.000$ / 7 dias mas]'',color:''#E8A33A'',bold:true,click_event:{action:''run_command'',command:''/trigger bazar set 12''},hover_event:{action:''show_text'',value:''Sumar 7 dias mas al puesto 2''}}]"} @self ?~haspermission{p=group.puesto2}'
  - 'command{c="tellraw <trigger.name> ['''',{text:'' Puesto 2: '',color:''white''},{text:''ocupado'',color:''red''}]"} @self ?~haspermission{p=astral.puesto.2} ?~!haspermission{p=group.puesto2}'
  - 'command{c="tellraw <trigger.name> ['''',{text:'' Puesto 3: '',color:''white''},{text:''libre '',color:''green''},{text:''[Alquilar 5.000$ / 7 dias]'',color:''#E8A33A'',bold:true,click_event:{action:''run_command'',command:''/trigger bazar set 3''},hover_event:{action:''show_text'',value:''Alquilar el puesto 3 por 5.000$''}}]"} @self ?~!haspermission{p=astral.puesto.3}'
  - 'command{c="tellraw <trigger.name> ['''',{text:'' Puesto 3: '',color:''white''},{text:''es tuyo '',color:''aqua''},{text:''[Renovar 5.000$ / 7 dias mas]'',color:''#E8A33A'',bold:true,click_event:{action:''run_command'',command:''/trigger bazar set 13''},hover_event:{action:''show_text'',value:''Sumar 7 dias mas al puesto 3''}}]"} @self ?~haspermission{p=group.puesto3}'
