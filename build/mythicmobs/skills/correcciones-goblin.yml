AST_GOLEM_INICIO_mina_sala1:
  Skills:
  - addtag{tag=ad.mina.sala1} @self
  - addtag{tag=ad.mina.sala1.wave} @self
  - addtag{tag=ad.vanilla} @self
  - command{c="execute as <caster.uuid> at @s run function astral:mob/roll"} @self
AST_GOLEM_CONVIERTE_mina_sala1:
  TargetConditions:
  - hastag{tag=ad.golem.mina.sala1} true
  Skills:
  - removetag{tag=ad.golem.mina.sala1;sync=true}
  - summon{type=astral_golem_cristal_mina_sala1;amount=1;radius=0;onSurface=false;sync=true}
  - remove{sync=true}
