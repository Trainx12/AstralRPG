header-footer:
  enabled: true
  designs:
    default:
      header:
        - "<dark_gray><strikethrough>                                                  </strikethrough>"
        - ""
        - "%animation:astral_titulo%"
        - "<gray>Bienvenido, <white><bold>%player%</bold> <dark_gray>| %condition:rango%"
        - ""
      footer:
        - ""
        - "<red>❤ <white>%player_health_rounded%<gray>/%player_max_health_rounded%   <gold>⛃ <yellow>%vault_eco_balance_formatted%   <aqua>⚡ <white>%auraskills_power%"
        - "<gray>Jugadores <white>%online%<dark_gray>/<gray>20   <dark_gray>✦   <gray>Ping <white>%ping%ms   <dark_gray>✦   <gray>TPS %server_tps_1_colored%"
        - "<gray>Estas en <white>%condition:mundo%   <dark_gray>✦   <gray>/spawn <dark_gray>vuelve al lobby"
        - ""
        - "%animation:astral_ip%"
        - "<dark_gray><strikethrough>                                                  </strikethrough>"
playerlist-objective:
  enabled: true
  value: "%player_health_rounded%"
  fancy-value: ""
  title: "Vida"
  render-type: HEARTS
  disable-condition: ''
belowname-objective:
  enabled: true
  value: "%player_health_rounded%"
  fancy-value: "<red>❤ <white>%player_health_rounded% <dark_gray>| <aqua>⚡%auraskills_power%"
  fancy-value-default: ""
  title: "<red>❤"
  disable-condition: '%world%=lobby'
  view-distance: 10
scoreboard:
  enabled: true
  toggle-command: /sb
  remember-toggle-choice: true
  hidden-by-default: false
  delay-on-join-milliseconds: 1500
  scoreboards:
    astral:
      title: "%animation:astral_titulo%"
      lines:
        - "<gray>⚔ <white><bold>%player%</bold>"
        - "<gray>Rango||%condition:rango%"
        - "<red>❤ Vida||<white>%player_health_rounded%<gray>/%player_max_health_rounded%"
        - "<gold>⛃ Oro||<yellow>%vault_eco_balance_formatted%"
        - "<aqua>⚡ Poder||<white>%auraskills_power%"
        - ""
        - "<aqua><bold>Misiones diarias</bold>"
        - "<gray>Fácil||%condition:diaria0%"
        - "<gray>Media||%condition:diaria1%"
        - "<gray>Difícil||%condition:diaria2%"
        - "<gray>Renuevan||<white>00:00 ARG"
        - ""
        - "<white>%date%"
        - "<gray>Hora argentina||<aqua>%time%"
        - "%animation:astral_ip%"
conditions:
  rango:
    conditions:
      - "%auraskills_power%>=1500"
    true: "<gradient:#FFD24A:#FF7A2A><bold>Leyenda</bold></gradient>"
    false: "%condition:rango1%"
  rango1:
    conditions:
      - "%auraskills_power%>=800"
    true: "<light_purple><bold>Heroe</bold>"
    false: "%condition:rango2%"
  rango2:
    conditions:
      - "%auraskills_power%>=400"
    true: "<aqua>Veterano"
    false: "%condition:rango3%"
  rango3:
    conditions:
      - "%auraskills_power%>=150"
    true: "<green>Aventurero"
    false: "<gray>Novato"
  titulo:
    conditions:
      - "%luckperms_prefix%="
    true: "<dark_gray>ninguno"
    false: "%luckperms_prefix%"
  mundo:
    conditions:
      - "%world%=lobby"
    true: "Lobby"
    false: "%condition:mundo2%"
  mundo2:
    conditions:
      - "%world%=world_nether"
    true: "<red>Nether"
    false: "%condition:mundo3%"
  mundo3:
    conditions:
      - "%world%=world_the_end"
    true: "<light_purple>End"
    false: "<green>Mundo"
  diaria0:
    conditions:
      - "%objective_score_{aq.done0}%=1"
    true: "<gray>Cobrada"
    false: "%condition:diaria0_activa%"
  diaria0_activa:
    conditions:
      - "%objective_score_{aq.active0}%=1"
    true: "%condition:diaria0_id1%"
    false: "<yellow>Sin aceptar"
  diaria0_id1:
    conditions:
      - "%objective_score_{aq.d0}%=1"
    true: "%condition:diaria0_lista1%"
    false: "%condition:diaria0_id2%"
  diaria0_lista1:
    conditions:
      - "%objective_score_{aq.hostil}%>=15"
    true: "<gold>Por cobrar"
    false: "<green>Activa <white>%objective_score_{aq.hostil}%/15"
  diaria0_id2:
    conditions:
      - "%objective_score_{aq.d0}%=2"
    true: "<green>Activa: entrega"
    false: "%condition:diaria0_id3%"
  diaria0_id3:
    conditions:
      - "%objective_score_{aq.d0}%=3"
    true: "<green>Activa: entrega"
    false: "%condition:diaria0_id4%"
  diaria0_id4:
    conditions:
      - "%objective_score_{aq.d0}%=4"
    true: "<green>Activa: entrega"
    false: "%condition:diaria0_id5%"
  diaria0_id5:
    conditions:
      - "%objective_score_{aq.d0}%=5"
    true: "%condition:diaria0_lista5%"
    false: "<green>Activa"
  diaria0_lista5:
    conditions:
      - "%objective_score_{aq.spider}%>=10"
    true: "<gold>Por cobrar"
    false: "<green>Activa <white>%objective_score_{aq.spider}%/10"
  diaria1:
