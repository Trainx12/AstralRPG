# DOCUMENTATION: https://docs.artillex-studios.com/axtrade.html
# ITEM BUILDER: https://docs.artillex-studios.com/item-builder.html

# ----- SETTINGS -----

title: '&0Intercambio con: %player%'
# a gui can have 1-6 rows
rows: 6

# ----- SLOTS -----

# the slots where the items can be placed
# make sure to not put decorative items or currency items in the these slots
# the own-slots and partner-slots must have an equal amount of slots
own-slots:
- 9-12
- 18-21
- 27-30
- 36-39
- 45-48

partner-slots:
- 14-17
- 23-26
- 32-35
- 41-44
- 50-53

# ----- ITEMS -----

# items on your side
own:
  confirm-item:
    slot: 0
    # you can use these placeholders:
    # %own-name%"
    # %partner-name%
    accept:
      material: RED_CONCRETE
      # if you want, you can add head textures, like this:
      #material: "PLAYER_HEAD"
      #texture: "%own-head%"
      name: '&#00ffdd&lCONFIRMAR INTERCAMBIO'
      lore:
      - ''
      - ' &7- &fRevisa ambos lados antes de confirmar.'
      - ''
      - '&#00ffdd&l> &#00ffddClick &8- &#00ffddConfirmar intercambio'
    cancel:
      material: LIME_CONCRETE
      name: '&#00ffdd&lCANCELAR CONFIRMACION'
      lore:
      - ''
      - ' &7- &fRetira tu confirmacion para cambiar la oferta.'
      - ''
      - '&#00ffdd&l> &#00ffddClick &8- &#00ffddRetirar confirmacion'
  # you can define as many currencies as you want, but make sure to copy them to the 'partner' section too!
  currency1:
    slot: 2
    # you need Vault installed for this
    currency: Vault
    material: GOLD_NUGGET
    name: '&#00ffdd&lORO'
    # you can use these placeholders:
    #  %amount% (the amount the player set)
    #  %tax-amount% (amount after tax)
    #  %tax-percent% (the % of tax on the currency)
    #  %tax-fee% (amount taken because of tax)
    lore:
    - '&7Tu oferta'
    - ''
    - ' &7- &fCantidad: &#00ffdd%amount%$'
    - ''
    - '&#00ffdd&l> &#00ffddClick &8- &#00ffddCambiar cantidad'

# items on your trade partner's side
partner:
  confirm-item:
    slot: 8
    # you can also use these placeholders:
    # %own-name%"
    # %partner-name%
    accept:
      material: RED_CONCRETE
      # if you want, you can add head textures, like this:
      #material: "PLAYER_HEAD"
      #texture: "%partner-head%"
      name: '&#00ffdd&lESPERANDO AL OTRO JUGADOR'
      lore:
      - ''
      - ' &7- &f%partner-name% todavia no confirmo.'
      - ''
    cancel:
      material: LIME_CONCRETE
      name: '&#00ffdd&lCONFIRMADO'
      lore:
      - ''
      - ' &7- &f%partner-name% ya confirmo.'
  currency1:
    slot: 6
    currency: Vault
    material: GOLD_NUGGET
    name: '&#00ffdd&lORO'
    # you can use these placeholders:
    #  %amount% (the amount the player set)
    #  %tax-amount% (amount after tax)
    #  %tax-percent% (the % of tax on the currency)
    #  %tax-fee% (amount taken because of tax)
    lore:
    - '&7Oferta de %partner-name%'
    - ''
    - ' &7- &fCantidad: &#00ffdd%amount%$'
    - ''
    - '&#00ffdd&l> &#00ffddClick &8- &#00ffddCambiar cantidad'

decoration-example:
  slot:
  - 4
  - 13
  - 22
  - 31
  - 40
  - 49
  material: LIGHT_BLUE_STAINED_GLASS_PANE
  name: ' '

# do not change this
version: 1
